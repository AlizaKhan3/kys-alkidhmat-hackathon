<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand-In · Smash & Sauce Kitchen</title>
<link rel="preload" as="image" href="/assets/chef.png">
<link rel="preload" as="image" href="/assets/chef-neutral.png">
<link rel="preload" as="image" href="/assets/chef-speaking.png">
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#2b1d14;--mut:#7a6a5e;--acc:#d9480f;--ok:#2f9e44;--warn:#e67700;--bad:#c92a2a;--line:#eadfd3}
@media(prefers-color-scheme:dark){:root{--bg:#1c1410;--card:#2a1e18;--ink:#f5ebe0;--mut:#b5a597;--line:#43332a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1000px;margin:auto;padding:16px;display:grid;gap:16px;grid-template-columns:280px 1fr}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:12px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.small{font-size:13px;color:var(--mut)}.av-wrap{width:140px;margin:auto;border-radius:14px;line-height:0;transition:box-shadow .25s}
.av-wrap img{width:100%;display:block;border-radius:12px;object-fit:contain}
.av-wrap.talk{animation:avTalk .8s ease-in-out infinite}
@keyframes avTalk{0%,100%{box-shadow:0 0 0 2px rgba(217,72,15,.2)}50%{box-shadow:0 0 0 4px #d9480f,0 0 18px 6px rgba(217,72,15,.45)}}
#log{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:88%;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}.u{align-self:flex-end;background:var(--acc);color:#fff;border:0}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;margin-bottom:4px}
.confident{background:var(--ok)}.qualified{background:var(--warn)}.escalated{background:var(--bad)}
.esc{border-color:var(--bad);border-left-width:5px}.src{font-size:12px;color:var(--mut);margin-top:6px;cursor:pointer;text-decoration:underline dotted}
.prov{display:none;font-size:12px;background:var(--bg);border-radius:8px;padding:6px;margin-top:4px}.prov.on{display:block}
.warn{background:#fff3bf;color:#5c4a00;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px}
form{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}button.g{background:var(--mut)}button.rec{background:var(--bad)}
.chips button{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:4px 10px;font-size:13px;margin:2px}
.meter{display:none;height:8px;margin-top:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter.on{display:block}#meterFill{height:100%;width:0;background:var(--ok);transition:width .08s linear}
#micStatus{min-height:1.2em;margin-top:6px}
table{width:100%;font-size:12px;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:3px;text-align:left}
</style></head><body>
<div class="wrap">
<aside class="card">
 <div id="av" class="av-wrap"><img id="avatarImg" src="/assets/chef.png" alt="Chef avatar"></div>
 <h1 id="name" style="text-align:center;margin-top:6px">Loading…</h1>
 <div class="small" style="text-align:center" id="spec"></div>
 <p class="small" id="consent"></p>
 <h2>Where I escalate</h2><div class="small" id="esc"></div>
 <h2>Honesty note</h2><div class="small" id="honest">No review results loaded yet.</div>
 <label class="small"><input type="checkbox" id="speak" checked style="flex:none"> Speak answers</label>
</aside>
<main class="card">
 <div id="log" aria-live="polite"></div>
 <div class="chips" id="chips"></div>
 <form id="f"><input id="q" placeholder="Ask a burger or pasta question (English ya Roman Urdu)…" autocomplete="off"><button type="button" class="g" id="mic" title="Speak (live draft appears as you talk)">🎤</button><button>Ask</button></form>
 <div class="meter" id="meter"><div id="meterFill"></div></div>
 <div class="small" id="micStatus"></div>
</main></div>
<script>
const $=id=>document.getElementById(id),log=$('log'),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SAMPLES=["What goes into your patty mixture?","Pickles kaise banate ho?","Patty toot rahi hai, kya karun?","How do you marinate the chicken?","Alfredo sauce patli reh gayi hai","What deals do you have?","Is the pasta gluten-free?","Can you make a zinger burger?"];
$('chips').innerHTML=SAMPLES.map(s=>`<button type="button">${esc(s)}</button>`).join('');
$('chips').onclick=e=>{if(e.target.tagName=='BUTTON'){$('q').value=e.target.textContent;$('f').requestSubmit()}};
fetch('/profile').then(r=>r.json()).then(p=>{$('name').textContent=p.name;$('spec').textContent=p.kitchen+' · '+p.specialty;
 $('consent').innerHTML=p.consent_confirmed?'✅ Chef has given written consent to be represented.':'⚠️ Consent NOT yet confirmed. Demo mode.';
 $('esc').innerHTML=p.escalation_topics.map(t=>'• '+esc(t.topic)).join('<br>')+`<br><br>Knowledge: ${p.counts.interview_entries} interview entries, ${p.counts.rules} rules, ${p.counts.preferences} preferences, ${p.counts.documented_gaps} known gaps (always escalated).`;
 add('a',{status:'qualified',answer:`Hi, I'm the stand-in for ${p.name} of ${p.kitchen}. I only answer from what she told us. Ask in English or Roman Urdu. If she didn't say it, I'll pass you back to her.`,sources:[],reason:'',_hello:1})});
fetch('/results').then(r=>r.json()).then(rows=>{if(!rows.length)return;const m=rows.filter(r=>r.chef_mark);if(!m.length){$('honest').textContent=`${rows.length} test questions prepared; chef review pending.`;return}
 const c=k=>m.filter(r=>r.chef_mark==k).length;$('honest').innerHTML=`Chef-reviewed ${m.length}/${rows.length}: <b>${c('agree')}</b> agree, <b>${c('disagree')}</b> disagree, <b>${c('should_have_escalated')}</b> should have escalated. Failures are kept in the sheet.`});
function add(role,r){const d=document.createElement('div');
 if(role=='u'){d.className='m u';d.textContent=r}else{d.className='m'+(r.status=='escalated'?' esc':'');
  let h=r._hello?'':`<span class="badge ${r.status}">${{confident:'Confident',qualified:'Qualified',escalated:'Escalated'}[r.status]}</span><br>`;
  h+=esc(r.answer);if(r.reason&&r.status=='escalated')h+=`<div class="small">Why: ${esc(r.reason)}</div>`;
  if(r.sources.length){h+=`<div class="src">Source: ${r.sources.map(s=>s.id).join(', ')} (tap for provenance)</div><div class="prov">${r.sources.map(s=>`<b>${s.id}</b> · ${s.kind} · match ${s.score}<br>“${esc(s.text)}”<br><i>${esc(s.source)}</i>`).join('<hr>')}</div>`}
  if(r.unverified)h+=`<div class="warn">Not yet verified by the chef.</div>`;d.innerHTML=h;
  d.querySelector('.src')?.addEventListener('click',()=>d.querySelector('.prov').classList.toggle('on'))}
 log.append(d);log.scrollTop=log.scrollHeight}
function tip(msg){const d=document.createElement('div');d.className='m small';d.textContent=msg;log.append(d);log.scrollTop=log.scrollHeight;return d}
function setStatus(msg){$('micStatus').textContent=msg||''}
const IMGS=['/assets/chef.png','/assets/chef-neutral.png','/assets/chef-speaking.png'];
IMGS.forEach(s=>{const i=new Image();i.src=s});
let talkTimer=null;
function setSpeaking(on){
 $('av').classList.toggle('talk',on);
 if(talkTimer){clearTimeout(talkTimer);talkTimer=null}
 const img=$('avatarImg');
 if(!on){if(img)img.src='/assets/chef.png';return}
 let state=true;
 if(img)img.src='/assets/chef-speaking.png';
 function step(){
  talkTimer=setTimeout(()=>{
   state=!state;
   if(img)img.src=state?'/assets/chef-speaking.png':'/assets/chef-neutral.png';
   step();
  },180+Math.floor(Math.random()*71));
 }
 step();
}
function browserSay(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';
 const vs=speechSynthesis.getVoices(),v=vs.find(v=>/en-IN/i.test(v.lang)&&/female|neerja|heera|swara/i.test(v.name))||vs.find(v=>/en-IN/i.test(v.lang));if(v)u.voice=v;
 u.onstart=()=>setSpeaking(true);u.onend=u.onerror=()=>setSpeaking(false);speechSynthesis.speak(u)}
async function say(t){if(!$('speak').checked||!t)return;
 try{const r=await fetch('/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  if(!r.ok)throw new Error('speak '+r.status);const url=URL.createObjectURL(await r.blob());const a=new Audio(url);
  a.onplay=()=>setSpeaking(true);a.onended=a.onerror=()=>{setSpeaking(false);URL.revokeObjectURL(url)};await a.play()}
 catch{browserSay(t)}}
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').value='';add('u',q);
 const th=tip('Thinking…');
 try{const r=await (await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})).json();th.remove();add('a',r);say(r.answer)}
 catch(err){th.remove();add('a',{status:'escalated',answer:'I could not reach my server. Please ask the chef directly.',reason:'Connection error',sources:[]})}};

/* STT: live browser captions + MediaRecorder → Whisper polish. User edits & taps Ask. */
function stopSpeaking(){try{speechSynthesis.cancel()}catch{}document.querySelectorAll('audio').forEach(a=>{try{a.pause();a.src=''}catch{}});setSpeaking(false)}
function pickMime(){if(!window.MediaRecorder)return'';
 for(const t of['audio/webm;codecs=opus','audio/webm','audio/mp4'])if(MediaRecorder.isTypeSupported(t))return t;return''}
function extFor(mime){if((mime||'').includes('mp4'))return'm4a';if((mime||'').includes('ogg'))return'ogg';return'webm'}
function junkTranscript(t){t=(t||'').trim().toLowerCase();
 return!t||t.length<2||/^(the the|thank you\.?|thanks for watching\.?|hello everyone\.?|subscribe\.?|bye\.?)$/.test(t)}
function putDraft(text){const q=$('q');q.value=(text||'').trim();q.focus();
 if(q.value){try{q.setSelectionRange(q.value.length,q.value.length)}catch{}}}

let session=null;

function paintMeter(level){$('meterFill').style.width=Math.min(100,Math.round(level*100))+'%';
 $('meterFill').style.background=level<0.05?'var(--bad)':level<0.15?'var(--warn)':'var(--ok)'}

function startLiveCaption(onUpdate){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return null;
 const r=new SR();r.lang='en-IN';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
 let finalText='',alive=true;
 r.onresult=e=>{let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript||'';
   if(e.results[i].isFinal)finalText+=(finalText&&!/\s$/.test(finalText)?' ':'')+t.trim();
   else interim+=t}
  onUpdate((finalText+(interim?' '+interim:'')).replace(/\s+/g,' ').trim(),!!interim)};
 r.onerror=()=>{};
 r.onend=()=>{if(alive){try{r.start()}catch{}}};
 try{r.start()}catch{return null}
 return{stop(){alive=false;try{r.onend=null;r.stop()}catch{}} , getFinal:()=>finalText.trim()}}

async function startRecording(){
 stopSpeaking();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('This browser cannot access the mic. Open http://localhost:8000 in desktop Chrome.');
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const mime=pickMime();
 if(!window.MediaRecorder)throw new Error('MediaRecorder missing — use desktop Chrome.');
 const rec=mime?new MediaRecorder(stream,{mimeType:mime,audioBitsPerSecond:128000}):new MediaRecorder(stream);
 const chunks=[];let peak=0;rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();
 if(ctx.state==='suspended')await ctx.resume();
 const source=ctx.createMediaStreamSource(stream);const analyser=ctx.createAnalyser();analyser.fftSize=2048;
 source.connect(analyser);const data=new Uint8Array(analyser.fftSize);let raf=0;
 const tick=()=>{analyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}
  const rms=Math.sqrt(sum/data.length);if(rms>peak)peak=rms;paintMeter(rms*4);raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick);

 const live=startLiveCaption((text,partial)=>{putDraft(text);
  setStatus(partial?'Listening… (live draft — keep speaking)':'Listening… tap ⏹ when done. Edit before Ask.')});

 await new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||e);rec.onstart=resolve;rec.start(200)});
 const started=Date.now();
 return{
  liveFinal:()=>(live&&live.getFinal())||$('q').value.trim(),
  async stop(){
   if(live)live.stop();
   cancelAnimationFrame(raf);
   const blob=await new Promise(resolve=>{rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'}));
    try{rec.requestData()}catch{}rec.stop()});
   stream.getTracks().forEach(t=>t.stop());try{await ctx.close()}catch{}
   $('meter').classList.remove('on');paintMeter(0);
   return{blob,filename:'question.'+extFor(rec.mimeType||mime),peak,ms:Date.now()-started,bytes:blob.size}}}
}

function setRecordingUI(on){
 $('mic').classList.toggle('rec',on);$('mic').textContent=on?'⏹':'🎤';
 $('mic').title=on?'Stop — put text in the box to edit':'Speak (live draft appears as you talk)';
 $('meter').classList.toggle('on',on)}

$('mic').onclick=async()=>{
 if(session){const s=session;session=null;setRecordingUI(false);
  const draft=s.liveFinal();if(draft)putDraft(draft);
  setStatus('Polishing transcript… you can edit the box, then tap Ask.');
  try{const {blob,filename,peak,ms,bytes}=await s.stop();
   if(ms<600){setStatus('Too short — speak ~2 seconds, then tap ⏹. Edit the box if anything appeared.');$('q').focus();return}
   if(peak<0.02){setStatus('Mic looked silent. Edit the draft or try again.');$('q').focus();return}
   if(bytes<2000){setStatus('Recording was empty. Edit the draft or try again.');$('q').focus();return}
   const fd=new FormData();fd.append('audio',blob,filename);
   const r=await fetch('/transcribe',{method:'POST',body:fd});const body=await r.json().catch(()=>({}));
   if(!r.ok){setStatus('Kept live draft (Whisper unavailable). Edit, then tap Ask.');$('q').focus();return}
   const text=(body.text||'').trim();
   if(junkTranscript(text)){if(!draft)putDraft('');setStatus('Couldn’t catch that clearly — edit the box or try again.');$('q').focus();return}
   putDraft(text);setStatus('Ready — edit if needed, then tap Ask to send.')}
  catch(err){setStatus('Kept live draft. Edit, then tap Ask. ('+(err&&err.message||err)+')');$('q').focus()}
  return}
 try{putDraft('');setStatus('Allow the microphone, then speak — text appears as you talk.');
  session=await startRecording();setRecordingUI(true);
  if(!$('q').value)setStatus('Listening… speak clearly. Green bar should bounce. Tap ⏹ when done.')}
 catch(err){session=null;setRecordingUI(false);
  const msg=String(err&&err.message||err);
  setStatus(msg.includes('NotAllowed')||msg.includes('Permission')?'Microphone blocked — click the lock icon near the URL → allow Mic for localhost.':msg)}};
</script></body></html>
